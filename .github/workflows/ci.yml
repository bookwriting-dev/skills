name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # darwin is the primary authoring platform, and sync-check.sh parses BSD
    # `diff -rq` output — a different format from GNU diff. Run both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The ledger scripts' only optional dependency. `make eval` skips the
      # behavioral ledger checks with a loud notice when it's absent; CI
      # installs it so the gate always runs the full set.
      - name: Install eval dependencies
        run: python3 -m pip install PyYAML
      # One step, running the same `make check` target a developer runs locally.
      # (Running the tools individually here let the Makefile go untested and
      # silently drift from the gate.)
      - name: Run the gate
        run: make check

  export-formats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install explicit format converters
        run: brew install pandoc typst
      - name: Verify actual export containers and source preservation
        run: make export-eval
