name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint skills (frontmatter, paths, doc drift)
        run: python3 tools/lint-skills.py
      - name: Check the generated inventory is current
        run: python3 tools/gen-inventory.py --check
      - name: Syntax-check every script
        run: python3 tools/compile-check.py
